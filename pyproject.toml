[project]
name = "mide-consolidador-streamlit"
version = "0.1.0"
description = "Aplicacion Streamlit para ejecutar el pipeline ETL MIDE desde insumos cargados por usuarios no tecnicos."
requires-python = ">=3.10"
dependencies = [
  "streamlit>=1.35",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "pymupdf>=1.24",
  "rapidfuzz>=3.14.3",
  "pdfplumber>=0.11.9",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py310"
